<!-- Form Container with butons-->

<div class="container">
	<div class="row">

<!-- English -->

<input type="text" id="fil.grade" class="form-control" placeholder="Filipino">

<!-- Science -->

	<br><br>

<!-- Grade -->

<input type="text" id="sci.grade" class="form-control" placeholder="Science">

     <br><br>

</div>

<center><button type="button" class="btn btn-danger" onclick="plus()">Calculate Average</button></center>


<div id="result" style="margin-top: 20px;"></div>
     
     <!--To get the answer -->

    <center><kbd id="gen-ave">Your average and rating will appear here.</kbd></center>  

</div>
</div>
 

<!-- Form's function script -->

<script>
	function plus(){
		var eng = +document.getElementById("eng.grade").value;
		var fil = +document.getElementById("fil.grade").value;
		var sci = +document.getElementById("sci.grade").value;

		if (isNaN(eng) || isNaN(fil) || isNaN(sci)){
			document.getElementById("gen-ave").innerHTML = "Please enter valid numbers.";return;
		}


	var ave = (eng + fil + sci) / 3;
	var rate;

	switch (true){
     case (ave >=94 && ave <=100):
     	rate = "Excellent";
     	break;

     case (ave >=87 && ave <94):
     	rate = "Above Satisfactory";
     	break;

     case (ave >=80 && ave <87):
     	rate = "Satisfactory";
     	break;

     case (ave >=75 && ave <80):
     	rate = "Needs Improvement";
     	break;

     case (ave >=70 && ave <75):
     	rate = "Poor";
     	break;

     default:
     	rate = "Invalid";
	}

	document.getElementById("gen-ave").innerHTML="Average: "+ ave.toFixed(2) + " | Your performance is " + rate;
}

</script>
